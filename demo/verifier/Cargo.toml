[package]
name = "nimbus-wasm-verifier"
description = "Nimbus Chain light-client verifier for the browser (wasm32, plain C ABI, no JS bindings) + the replayed-tape generator"
version = "0.18.0"
edition = "2021"
license = "MIT"
publish = false

# Not part of the nimbus-core workspace (the engine stays 12 crates): this is the demo's own package.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "make-tape"
path = "src/bin/make_tape.rs"

[dependencies]
nimbus-lightclient = { path = "../../nimbus-core/crates/nimbus-lightclient" }
ed25519-dalek = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nimbus-hash = { path = "../../nimbus-core/crates/nimbus-hash" }
nimbus-match = { path = "../../nimbus-core/crates/nimbus-match" }
nimbus-order = { path = "../../nimbus-core/crates/nimbus-order" }
nimbus-journal = { path = "../../nimbus-core/crates/nimbus-journal" }
nimbus-pipeline = { path = "../../nimbus-core/crates/nimbus-pipeline" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
