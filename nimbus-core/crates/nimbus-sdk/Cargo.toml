[package]
name = "nimbus-sdk"
description = "Agent-side pre-trade risk policy, rate limiting and exact pre-trade simulation"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
nimbus-match = { path = "../nimbus-match" }
nimbus-order = { path = "../nimbus-order" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
proptest = "1"
