<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Light-client proof path</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .n{fill:#ffffff;stroke:#334155;stroke-width:1.2}
      .p{fill:#eef2ff;stroke:#4338ca;stroke-width:1.4}
      .x{fill:#ecfdf5;stroke:#047857;stroke-width:1.4}
      .e{stroke:#94a3b8;stroke-width:1.2;fill:none}
      .v{stroke:#047857;stroke-width:2;fill:none;marker-end:url(#a)}
      .t{fill:#0f172a;text-anchor:middle;font-size:12px}
      .s{fill:#475569;font-size:11px}
    </style>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#0f172a">Finality proof for op 2 of 5: RFC 6962 audit path → header → ⌈0.8n⌉ validator signatures</text>

  <!-- tree for 5 leaves: split at 4 -->
  <circle class="x" cx="300" cy="80" r="22"/><text class="t" x="300" y="84">root</text>
  <circle class="x" cx="200" cy="150" r="20"/><text class="t" x="200" y="154">n0-3</text>
  <circle class="p" cx="420" cy="150" r="20"/><text class="t" x="420" y="154">L4</text>
  <circle class="p" cx="140" cy="220" r="20"/><text class="t" x="140" y="224">n0-1</text>
  <circle class="x" cx="260" cy="220" r="20"/><text class="t" x="260" y="224">n2-3</text>
  <circle class="x" cx="230" cy="290" r="18"/><text class="t" x="230" y="294">L2</text>
  <circle class="p" cx="290" cy="290" r="18"/><text class="t" x="290" y="294">L3</text>
  <path class="e" d="M300,80 L200,150 M300,80 L420,150 M200,150 L140,220 M200,150 L260,220 M260,220 L230,290 M260,220 L290,290"/>
  <path class="v" d="M230,272 L255,240"/>
  <path class="v" d="M245,203 L215,166"/>
  <path class="v" d="M218,138 L280,95"/>
  <text x="70" y="340" class="s">green: recomputed by the verifier   blue: audit path (3 hashes here; ⌈log₂ m⌉ in general)</text>
  <text x="70" y="358" class="s">leaf = H(0x00 ‖ op), node = H(0x01 ‖ l ‖ r), SHA-384; index and size fix left/right at every level</text>

  <rect class="n" x="520" y="55" width="360" height="72" rx="6"/>
  <text x="535" y="78" fill="#0f172a">header (154 B) = 0x02 ‖ height ‖ rank ‖</text>
  <text x="535" y="96" fill="#0f172a">batch root ‖ prev ‖ history accumulator</text>
  <text x="535" y="114" class="s">the recomputed root must equal batch root</text>
  <rect class="n" x="520" y="150" width="360" height="72" rx="6"/>
  <text x="535" y="173" fill="#0f172a">certificate: (validator index, Ed25519 sig)*</text>
  <text x="535" y="191" fill="#0f172a">on SHA-384(header); distinct; ≥ ⌈0.8n⌉</text>
  <text x="535" y="209" class="s">one ZIP-215 batch; weak keys refused at set creation</text>
  <rect class="x" x="520" y="245" width="360" height="72" rx="6"/>
  <text x="535" y="268" fill="#0f172a">accept ⇒ op is final at (height, rank)</text>
  <text x="535" y="286" fill="#0f172a">n = 21: 1.92 KB proof (results/metrics.json)</text>
  <text x="535" y="304" class="s">forging needs a SHA-384 collision or an Ed25519 forgery</text>
  <path class="v" d="M322,80 L520,90"/>
  <path class="v" d="M700,127 L700,150"/>
  <path class="v" d="M700,222 L700,245"/>
</svg>
