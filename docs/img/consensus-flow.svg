<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Consensus flow</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .b{fill:#ffffff;stroke:#334155;stroke-width:1.2}
      .f{fill:#ecfdf5;stroke:#047857;stroke-width:1.3}
      .sl{fill:#eef2ff;stroke:#4338ca;stroke-width:1.3}
      .x{fill:#fff7ed;stroke:#c2410c;stroke-width:1.2}
      .e{stroke:#475569;stroke-width:1.2;fill:none;marker-end:url(#a)}
      .t{fill:#0f172a;text-anchor:middle}
      .s{fill:#475569;font-size:11px;text-anchor:middle}
    </style>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#0f172a">Dual-path consensus per slot (whitepaper §3.2) and the engine's certification path</text>

  <rect class="b" x="20" y="150" width="150" height="60" rx="6"/><text class="t" x="95" y="175">leader proposes π</text><text class="s" x="95" y="193">(t, parentQC, root)</text>

  <rect class="f" x="230" y="70" width="250" height="70" rx="6"/><text class="t" x="355" y="96">fast path γf</text><text class="s" x="355" y="114">one round, quorum ≥ 4/5 of stake</text>
  <rect class="sl" x="230" y="220" width="250" height="70" rx="6"/><text class="t" x="355" y="246">slow path γs</text><text class="s" x="355" y="264">two-chain (HotStuff-2), quorum ≥ 2/3</text>

  <rect class="b" x="540" y="150" width="150" height="60" rx="6"/><text class="t" x="615" y="175">first valid wins</text><text class="s" x="615" y="193">commit Ct = Ct−1 ‖ Bt</text>
  <rect class="x" x="540" y="285" width="150" height="70" rx="6"/><text class="t" x="615" y="310">timeout / skip</text><text class="s" x="615" y="328">next leader includes</text><text class="s" x="615" y="343">omitted ops</text>

  <rect class="f" x="735" y="70" width="150" height="110" rx="6"/>
  <text class="t" x="810" y="94">engine path</text>
  <text class="s" x="810" y="114">n = 4 certifiers</text>
  <text class="s" x="810" y="130">q = 3 (3q &gt; 2n)</text>
  <text class="s" x="810" y="146">re-execute journal</text>
  <text class="s" x="810" y="162">sign once per slot</text>
  <rect class="b" x="735" y="210" width="150" height="70" rx="6"/><text class="t" x="810" y="236">safety (tested)</text><text class="s" x="810" y="254">f = 1 of 4: never two</text><text class="s" x="810" y="268">certified checkpoints</text>

  <path class="e" d="M170,170 L230,110"/>
  <path class="e" d="M170,190 L230,250"/>
  <path class="e" d="M480,105 L540,165"/>
  <path class="e" d="M480,255 L540,195"/>
  <path class="e" d="M480,275 L540,310"/>
  <path class="e" d="M690,180 L735,150"/>
  <path class="e" d="M810,180 L810,210"/>
  <text class="s" x="355" y="380">Proved in the whitepaper: Theorems A, B (f &lt; 1/3). Simulated here: f = 1 of 4 proptests (safety + liveness).</text>
</svg>
